version: '3.8'

networks:
  apishield-network:
    name: apishield-network
    driver: bridge

volumes:
  mysql-data:
    name: apishield-mysql-data
  redis-data:
    name: apishield-redis-data
  kafka-data:
    name: apishield-kafka-data
  grafana-data:
    name: apishield-grafana-data

services:
  # ============================================================================
  # MySQL Database (Logical Multi-Schema Service Isolation)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: apishield-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - ../mysql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apishield-network

  # ============================================================================
  # Redis Cache & In-Memory Rate Limiting Tier
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: apishield-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ../redis/scripts:/usr/local/etc/redis/scripts:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apishield-network

  # ============================================================================
  # Apache Kafka Broker (KRaft Mode - No Zookeeper Required)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: apishield-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L622nShTUiBenDuDwKdOw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - apishield-network

  # ============================================================================
  # Automated Kafka Topic Provisioning
  # ============================================================================
  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: apishield-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
    volumes:
      - ../kafka/init-topics.sh:/scripts/init-topics.sh:ro
    networks:
      - apishield-network
    restart: "no"

  # ============================================================================
  # Prometheus Timeseries Observability (Profile: monitoring)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: apishield-prometheus
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - apishield-network

  # ============================================================================
  # Grafana Dashboard Telemetry (Profile: monitoring)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: apishield-grafana
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - apishield-network
