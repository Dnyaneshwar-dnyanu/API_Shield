version: '3.8'

networks:
  apishield-network:
    name: apishield-network
    driver: bridge

volumes:
  mysql-data:
    name: apishield-mysql-data
  redis-data:
    name: apishield-redis-data
  kafka-data:
    name: apishield-kafka-data
  grafana-data:
    name: apishield-grafana-data

services:
  # ============================================================================
  # 1. CORE DATA & MESSAGING INFRASTRUCTURE
  # ============================================================================

  mysql:
    image: mysql:8.0
    container_name: apishield-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - ../mysql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apishield-network

  redis:
    image: redis:7.2-alpine
    container_name: apishield-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ../redis/scripts:/usr/local/etc/redis/scripts:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apishield-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: apishield-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-kafka}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L622nShTUiBenDuDwKdOw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - apishield-network

  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: apishield-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
    volumes:
      - ../kafka/init-topics.sh:/scripts/init-topics.sh:ro
    networks:
      - apishield-network
    restart: "no"

  # ============================================================================
  # 2. SERVICE DISCOVERY & EDGE GATEWAY ROUTING
  # ============================================================================

  discovery-server:
    build:
      context: ../../backend
      dockerfile: discovery-server/Dockerfile
    container_name: apishield-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apishield-network

  api-gateway:
    build:
      context: ../../backend
      dockerfile: api-gateway/Dockerfile
    container_name: apishield-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: 8080
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-apishield-internal-secret-token-key-32bytes-min!}
      REGISTRY_SERVICE_URL: http://api-registry-service:8082
      API_KEY_SERVICE_URL: http://api-key-service:8084
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - apishield-network

  # ============================================================================
  # 3. CONTROL PLANE MICROSERVICES
  # ============================================================================

  user-service:
    build:
      context: ../../backend
      dockerfile: user-service/Dockerfile
    container_name: apishield-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_user
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  api-registry-service:
    build:
      context: ../../backend
      dockerfile: api-registry-service/Dockerfile
    container_name: apishield-api-registry-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_registry
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  subscription-service:
    build:
      context: ../../backend
      dockerfile: subscription-service/Dockerfile
    container_name: apishield-subscription-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_subscription
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  api-key-service:
    build:
      context: ../../backend
      dockerfile: api-key-service/Dockerfile
    container_name: apishield-api-key-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_apikey
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  payment-service:
    build:
      context: ../../backend
      dockerfile: payment-service/Dockerfile
    container_name: apishield-payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_payment
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  notification-service:
    build:
      context: ../../backend
      dockerfile: notification-service/Dockerfile
    container_name: apishield-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_notification
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  analytics-service:
    build:
      context: ../../backend
      dockerfile: analytics-service/Dockerfile
    container_name: apishield-analytics-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: apishield_analytics
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-d3f4u1t-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-d3v3l0pm3nt-0nly!}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - apishield-network

  # ============================================================================
  # 4. FRONTEND SINGLE PAGE APPLICATION
  # ============================================================================

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: apishield-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api-gateway
    networks:
      - apishield-network

  # ============================================================================
  # 5. OBSERVABILITY & TELEMETRY STACK
  # ============================================================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: apishield-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - apishield-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: apishield-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/apishield:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - apishield-network
