# ==============================================================================
# APIShield — Redis Configuration
# Optimized for In-Memory API Key Authentication & Sliding Window Rate Limiting
# ==============================================================================

# Networking
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 256mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence (Append Only File for high-durability key caching)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Client & Connection Tuning
maxclients 10000

# Logging
loglevel notice
logfile ""
