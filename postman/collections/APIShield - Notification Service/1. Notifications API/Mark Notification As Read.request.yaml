$kind: http-request
url: "{{notificationUrl}}/api/v1/notifications/{{notificationId}}/read"
method: PUT
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Notification marked as read", function () {
          var json = pm.response.json();
          pm.expect(json.isRead).to.be.true;
      });
    language: text/javascript
order: 5000
