$kind: http-request
url: "{{notificationUrl}}/api/v1/notifications/my"
method: GET
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns user notification list", function () {
          var json = pm.response.json();
          pm.expect(json.content).to.be.an('array');
      });
    language: text/javascript
order: 3000
