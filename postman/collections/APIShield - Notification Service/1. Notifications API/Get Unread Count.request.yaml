$kind: http-request
url: "{{notificationUrl}}/api/v1/notifications/unread-count"
method: GET
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns unread count", function () {
          var json = pm.response.json();
          pm.expect(json.unreadCount).to.be.a('number');
      });
    language: text/javascript
order: 6000
