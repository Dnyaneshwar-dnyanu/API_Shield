$kind: http-request
url: "{{apiKeyUrl}}/api/v1/keys"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{userId}}"
body:
  type: text
  content: |-
    {
      "name": "Production Client Key",
      "apiId": "{{apiId}}",
      "subscriptionId": "{{subscriptionId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var json = pm.response.json();
          pm.environment.set('apiKeyId', json.id);
          pm.environment.set('apiKey', json.apiKey);
          console.log('Saved apiKeyId and raw apiKey to environment');
      }
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Plaintext apiKey returned with ash_live_ prefix", function () {
          var json = pm.response.json();
          pm.expect(json.apiKey).to.match(/^ash_live_/);
      });
    language: text/javascript
order: 1000
