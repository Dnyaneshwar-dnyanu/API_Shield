$kind: http-request
url: "{{apiKeyUrl}}/api/v1/keys"
method: GET
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is an array without raw secrets", function () {
          var json = pm.response.json();
          pm.expect(Array.isArray(json)).to.be.true;
          if (json.length > 0) {
              pm.expect(json[0].apiKey).to.be.undefined;
              pm.expect(json[0].keyHash).to.be.undefined;
          }
      });
    language: text/javascript
order: 2000
