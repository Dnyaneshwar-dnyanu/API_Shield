$kind: http-request
url: "{{apiKeyUrl}}/api/v1/keys/{{apiKeyId}}/roll"
method: POST
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          pm.environment.set('apiKeyId', json.id);
          pm.environment.set('apiKey', json.apiKey);
          console.log('Saved newly rolled apiKeyId and raw apiKey to environment');
      }
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Newly rolled apiKey returned", function () {
          var json = pm.response.json();
          pm.expect(json.apiKey).to.match(/^ash_live_/);
      });
    language: text/javascript
order: 5000
