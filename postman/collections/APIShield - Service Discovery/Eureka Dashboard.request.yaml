$kind: http-request
url: "{{eurekaUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is Eureka Dashboard HTML", function () {
          pm.expect(pm.response.text()).to.include("Spring Eureka");
      });
    language: text/javascript
order: 1000
