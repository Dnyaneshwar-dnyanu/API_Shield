$kind: http-request
url: "{{paymentUrl}}/api/v1/payments/webhook"
method: POST
headers:
  Content-Type: application/json
  X-Razorpay-Signature: "simulated_webhook_signature"
body:
  type: text
  content: |-
    {
      "id": "evt_simulated_fail_001",
      "event": "payment.failed",
      "payload": {
        "payment": {
          "entity": {
            "id": "pay_simulated_fail_001",
            "order_id": "{{orderId}}",
            "error_description": "Card declined by user bank"
          }
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 or 400", function () {
          pm.expect([200, 400]).to.include(pm.response.code);
      });
    language: text/javascript
order: 2000
