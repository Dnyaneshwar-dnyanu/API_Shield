$kind: http-request
url: "{{paymentUrl}}/api/v1/payments/{{paymentId}}/invoice"
method: GET
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Invoice number is present", function () {
          var json = pm.response.json();
          pm.expect(json.invoiceNumber).to.be.a('string');
      });
    language: text/javascript
order: 3000
