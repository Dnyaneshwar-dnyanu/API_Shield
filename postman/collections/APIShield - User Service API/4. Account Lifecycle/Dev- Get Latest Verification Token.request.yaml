$kind: http-request
name: "Dev: Get Latest Verification Token"
url: "{{baseUrl}}/api/v1/auth/dev/latest-verification-token?email=alex.dev@apishield.io"
method: GET
queryParams:
  email: alex.dev@apishield.io
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          pm.environment.set('verificationToken', json.verificationToken);
          console.log('Captured verificationToken for testing');
      }
    language: text/javascript
order: 2000
