$kind: http-request
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          pm.environment.set('accessToken', json.accessToken);
          console.log('Rotated and saved new accessToken');
      }
    language: text/javascript
order: 4000
