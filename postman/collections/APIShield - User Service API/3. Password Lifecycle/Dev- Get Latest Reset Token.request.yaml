$kind: http-request
name: "Dev: Get Latest Reset Token"
url: "{{baseUrl}}/api/v1/auth/dev/latest-reset-token?email=alex.dev@apishield.io"
method: GET
queryParams:
  email: alex.dev@apishield.io
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          pm.environment.set('resetToken', json.resetToken);
          console.log('Captured resetToken for testing');
      }
    language: text/javascript
order: 3000
