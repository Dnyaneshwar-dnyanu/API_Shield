$kind: http-request
url: "{{baseUrl}}/api/v1/users/me/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "SecureP@ss123",
      "newPassword": "BrandNewP@ss456!",
      "confirmNewPassword": "BrandNewP@ss456!"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
