$kind: http-request
url: "{{gatewayUrl}}/api/v1/apis"
method: GET
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gateway forwards to api-registry-service with 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
