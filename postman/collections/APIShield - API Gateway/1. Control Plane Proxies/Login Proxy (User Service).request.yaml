$kind: http-request
url: "{{gatewayUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "developer@apishield.io",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gateway forwards to user-service with 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Access token received", function () {
          var json = pm.response.json();
          pm.expect(json.accessToken).to.be.a('string');
          pm.environment.set('accessToken', json.accessToken);
      });
    language: text/javascript
order: 2000
