$kind: http-request
url: "{{gatewayUrl}}/api/v1/subscriptions"
method: GET
headers:
  Authorization: "Bearer {{accessToken}}"
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gateway forwards to subscription-service with 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
