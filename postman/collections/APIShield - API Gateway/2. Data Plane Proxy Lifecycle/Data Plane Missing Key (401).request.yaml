$kind: http-request
url: "{{gatewayUrl}}/gateway/{{apiSlug}}/data"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
      pm.test("RFC 7807 Problem Detail returned for missing key", function () {
          var json = pm.response.json();
          pm.expect(json.title).to.eql("Missing API Key");
          pm.expect(json.status).to.eql(401);
      });
    language: text/javascript
order: 2000
