$kind: http-request
url: "{{gatewayUrl}}/gateway/{{apiSlug}}/data"
method: GET
headers:
  X-API-Key: "{{apiKey}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status is 200 or 429", function () {
          pm.expect([200, 429]).to.include(pm.response.code);
      });
      if (pm.response.code === 429) {
          pm.test("RFC 7807 Problem Detail for Rate Limit Exceeded", function () {
              var json = pm.response.json();
              pm.expect(json.title).to.eql("Rate Limit Exceeded");
              pm.expect(json.status).to.eql(429);
              pm.expect(pm.response.headers.get("Retry-After")).to.eql("1");
          });
      }
    language: text/javascript
order: 5000
