$kind: http-request
url: "{{gatewayUrl}}/gateway/{{apiSlug}}/data"
method: GET
headers:
  X-API-Key: "{{apiKey}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK or upstream response", function () {
          pm.expect([200, 204]).to.include(pm.response.code);
      });
      pm.test("Downstream response received through Gateway", function () {
          pm.expect(pm.response.headers.get("X-Correlation-ID")).to.be.a('string');
      });
    language: text/javascript
order: 1000
