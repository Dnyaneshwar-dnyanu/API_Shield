$kind: http-request
url: "{{registryUrl}}/api/v1/internal/plans/{{planId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Plan ID matches environment", function () {
          var json = pm.response.json();
          pm.expect(json.id).to.eql(pm.environment.get('planId'));
      });
    language: text/javascript
order: 2000
