$kind: http-request
url: "{{registryUrl}}/api/v1/internal/apis/resolve/{{apiSlug}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Slug matches resolved route", function () {
          var json = pm.response.json();
          pm.expect(json.slug).to.eql(pm.environment.get('apiSlug'));
      });
    language: text/javascript
order: 1000
