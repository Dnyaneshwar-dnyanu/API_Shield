$kind: http-request
url: "{{registryUrl}}/api/v1/apis/{{apiId}}/deprecate"
method: PUT
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Status is DEPRECATED", function () {
          var json = pm.response.json();
          pm.expect(json.status).to.eql("DEPRECATED");
      });
    language: text/javascript
order: 6000
