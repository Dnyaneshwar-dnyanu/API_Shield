$kind: http-request
url: "{{registryUrl}}/api/v1/apis/{{apiId}}/plans"
method: GET
headers:
  X-User-Id: "{{userId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
