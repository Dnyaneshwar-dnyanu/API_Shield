$kind: http-request
url: "{{registryUrl}}/api/v1/apis/{{apiId}}/plans"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{userId}}"
body:
  type: text
  content: |-
    {
      "name": "Standard Tier",
      "planType": "PAID",
      "priceCents": 2900,
      "billingCycle": "MONTHLY",
      "rateLimitRps": 25,
      "quotaMonthly": 100000,
      "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var json = pm.response.json();
          pm.environment.set('planId', json.id);
          console.log('Saved planId to environment');
      }
    language: text/javascript
order: 3000
