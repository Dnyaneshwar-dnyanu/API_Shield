server:
  port: 0

spring:
  application:
    name: api-registry-service-test

  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:h2:mem:apishield_registry;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
