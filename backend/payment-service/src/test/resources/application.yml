server:
  port: 0

spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:apishield_payment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

razorpay:
  key-id: rzp_test_mock_key
  key-secret: rzp_test_mock_secret
  webhook-secret: rzp_test_mock_webhook_secret
  mock: true

services:
  subscription-service:
    url: http://localhost:8083
  api-registry-service:
    url: http://localhost:8082
