server:
  port: 0

spring:
  application:
    name: notification-service-test

  datasource:
    url: jdbc:h2:mem:apishield_notification;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    listener:
      auto-startup: false

  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

apishield:
  security:
    internal-token: test-internal-secret-token-key-32bytes-min!
  notification:
    from-email: no-reply@apishield.io
    sender-name: APIShield Platform
    mock-delivery: true
