spring:
  application:
    name: user-service-test
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:h2:mem:apishield_user;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    secret: t3st-s3cur3-256-b1t-jwt-s3cr3t-k3y-f0r-un1t-and-1nt3gr4t10n-t3st1ng!
    issuer: apishield-user-service
    expiration-seconds: 3600
    refresh-expiration-seconds: 604800
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
    refresh-cookie-path: /api/v1/auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    enabled: false
